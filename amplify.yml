version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm install --global npm@10.9.9
        - node --version
        - npm --version
        - npm ci --cache .npm --prefer-offline
        - cp config/sandbox-outputs.json amplify_outputs.json
    build:
      commands:
        - npx expo export --platform web
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
