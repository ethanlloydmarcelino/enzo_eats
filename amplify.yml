version: 1
backend:
  phases:
    build:
      commands:
        # `npm ci` is intentionally avoided here: @aws-amplify/data-construct
        # bundles its own exact-pinned OpenTelemetry deps, which trips npm's
        # stricter lockfile-consistency check under `ci` even on a clean
        # lockfile. `npm install` installs the same tree without that check.
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install --cache .npm --prefer-offline
    build:
      commands:
        - npx expo export -p web
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
